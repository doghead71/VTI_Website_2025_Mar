<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Calculator </title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>
        <header>
            <div>
                <img src="../img/logo.png" alt="logo" >
            </div>
            <h1>Design Fusion Studio</h1>
        </header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/about.html">About</a></li>
                <li><a href="../pages/contact.html">Contact</a></li>
                <li><a href="../pages/services.html">Services</a></li>
                <li><a href="../pages/sample.html">Samples</a></li>
                <li><a href="../pages/gallery.html">Gallery</a></li>
                <li><a href="../pages/calculator.html">Calculator</a></li>
            </ul>
        </nav>
        <div class="calculator-page-wrapper">
            <div class="calculator-container">
                <input type="text" class="display" >

                <div class="buttons">
                    <button class="operator" type="button" data-value="AC">AC</button>
                    <button class="operator" type="button" data-value="DEL">DEL</button>
                    <button class="operator" type="button" data-value="%">%</button>
                    <button class="operator" type="button" data-value="/">/</button>

                    <button type="button" data-value="7">7</button>
                    <button type="button" data-value="8">8</button>
                    <button type="button" data-value="9">9</button>
                    <button class="operator" type="button" data-value="*">*</button>

                    <button type="button" data-value="4">4</button>
                    <button type="button" data-value="5">5</button>
                    <button type="button" data-value="6">6</button>
                    <button class="operator" type="button" data-value="-">-</button>

                    <button type="button" data-value="1">1</button>
                    <button type="button" data-value="2">2</button>
                    <button type="button" data-value="3">3</button>
                    <button class="operator" type="button" data-value="+">+</button>

                    <button type="button" data-value="0">0</button>
                    <button type="button" data-value="00">00</button>
                    <button type="button" data-value=".">.</button>
                    <button class="operator" type="button" data-value="=">=</button>
                </div>
            </div>
        </div>
        <script src="../scripts/calculator.js"></script>
    </body>

</html>
