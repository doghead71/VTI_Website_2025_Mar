<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/calc.css">
    <title> Caclulator Web App</title>
</head>
<body>
    <div id="screen_container">
        <div id="Calculator">
            <div id="Display">
                <input type="text" name="display" value="">
            </div>
            <div id="keypad">
                    <button name="0" type="button" onclick="press('0')">0</button>
                    <button name="1" type="button" onclick="press('1')">1</button>
                    <button name="2" type="button" onclick="press('2')">2</button>
                    <button name="plus" type="button" onclick="press('+')">+</button>

                    <button name="3" type="button" onclick="press('3')">3</button>
                    <button name="4" type="button" onclick="press('4')">4</button>
                    <button name="5" type="button" onclick="press('5')">5</button>
                    <button name="minus" type="button" onclick="press('-')">-</button>

                    <button name="6" type="button" onclick="press('6')">6</button>
                    <button name="7" type="button" onclick="press('7')">7</button>
                    <button name="8" type="button" onclick="press('8')">8</button>
                    <button name="divide" type="button" onclick="press('/')">/</button>

                    <button name="multiply" type="button" onclick="press('*')">*</button>
                    <button name="9" type="button" onclick="press('9')">9</button>
                    <button name="clear" type="button" onclick="clearAll()">clear</button>
                    <button name="equal" type="button" onclick="calc()">=</button>
            </div>
        </div>
    </div>
    <script src="../scripts/calculate.js"></script>
</body>

</html>
