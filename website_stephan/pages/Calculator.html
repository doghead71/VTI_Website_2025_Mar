<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/calc.css">
    <title> Caclulator Web App</title>
</head>
<body>
    <div id="screen_container">
        <div id="Calculator">
            <div id="Display">
                <input type="text" name="display" value="">
            </div>
            <div id="keypad">
                    <button name="0" type="button" value="0">0</button>
                    <button name="1" type="button" value="1">1</button>
                    <button name="2" type="button" value="2">2</button>
                    <button name="plus" type="button" value="+">+</button>

                    <button name="3" type="button" value="3">3</button>
                    <button name="4" type="button" value="4">4</button>
                    <button name="5" type="button" value="5">5</button>
                    <button name="minus" type="button" value="-">-</button>

                    <button name="6" type="button" value="6">6</button>
                    <button name="7" type="button" value="7">7</button>
                    <button name="8" type="button" value="8">8</button>
                    <button name="divide" type="button" value="/">/</button>

                    <button name="multiply" type="button" value="*">*</button>
                    <button name="9" type="button" value="9">9</button>
                    <button name="decimal" type="button" value=".">.</button>
                    <button name="equal" type="button" value="=">=</button>
            </div>
        </div>
    </div>
</body>

</html>
