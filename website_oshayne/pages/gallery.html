<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style> 
    Nav li a {
    text-decoration: none;
    color: inherit;
    padding: 10px 20px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease;
}

Nav li a:visited{
    text-decoration: none;
    color: inherit;
    
}

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            padding: 0;
            margin: 0;
            column-gap: 20px;
            row-gap: 10px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Image gallery</h1>
    <div class="gallery">
        <img src="../img/gallery/image 1.jpg" alt="image 1">
        <img src="../img/gallery/image 2.jpg" alt="image 2">
        <img src="../img/gallery/image 3.jpg" alt="image 3">
        <img src="../img/gallery/image 4.jpg" alt="image 4">
        <img src="../img/gallery/image 5.jpeg" alt="image 5">
        <img src="../img/gallery/image 6.jpg" alt="image 6">
        <img src="../img/gallery/image 7.jpg" alt="image 7">
        <img src="../img/gallery/image 8.jpg" alt="image 8">
        <img src="../img/gallery/image 9.jpg" alt="image 9">
        <img src="../img/gallery/image 10.jpg" alt="image 10">
        <img src="../img/gallery/image 11.jpeg" alt="image 11">
        <img src="../img/gallery/image 12.jpg" alt="image 12">
    </div>
</body>

</html>
